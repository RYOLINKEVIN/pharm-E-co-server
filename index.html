<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="appTitle">Pharm-E-co服務器數據管理台</title>
    <!-- Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- QRCode.js 生成庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- HTML5-QRCode 掃描庫 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        apple: {
                            bg: '#000000',
                            card: 'rgba(255, 255, 255, 0.65)',
                            border: 'rgba(255, 255, 255, 0.4)',
                            text: '#1d1d1f',
                            subtext: '#505055',
                            blue: '#0071e3',
                            blueHover: '#0077ED',
                            red: '#ff3b30',
                            orange: '#ff9500',
                            green: '#34c759'
                        }
                    },
                    boxShadow: {
                        'apple': '0 8px 32px rgba(0,0,0,0.15)',
                        'apple-sm': '0 2px 12px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        :root {
            --primary: #0071e3;
            --danger: #ff3b30;
            --success: #34c759;
            --warning: #ff9500;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
        }

        /* 🍎 Apple Music 風格暗色流動漸變背景 */
        body {
            background: linear-gradient(
                -45deg, 
                #000000, 
                #1b0044, 
                #001659, 
                #4a3800, 
                #1b0044  
            );
            background-size: 400% 400%;
            animation: appleMusicFlow 8s ease infinite; 
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes appleMusicFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @layer components {
            .glass-card {
                @apply bg-apple-card backdrop-blur-3xl border border-apple-border shadow-apple rounded-[2rem] transition-all duration-500;
            }
            .apple-input {
                @apply w-full bg-white/40 hover:bg-white/60 focus:bg-white border border-transparent focus:border-apple-blue/50 focus:shadow-[0_0_0_4px_rgba(0,113,227,0.15)] rounded-2xl px-4 py-3.5 text-apple-text placeholder-gray-500 focus:outline-none transition-all duration-300;
            }
            .apple-btn {
                @apply px-4 py-2 rounded-full font-semibold text-[0.85rem] transition-all duration-200 active:scale-95 flex items-center justify-center gap-1.5;
            }
            .btn-primary { @apply bg-apple-blue text-white hover:bg-apple-blueHover shadow-md; }
            .btn-secondary { @apply bg-white/60 text-apple-text hover:bg-white/80 backdrop-blur-md shadow-sm; }
            .btn-danger { @apply bg-apple-red text-white hover:bg-red-600 shadow-md; }
            .btn-warning { @apply bg-apple-orange text-white hover:bg-orange-500 shadow-md; }
            .btn-dark { @apply bg-[#1d1d1f] text-white hover:bg-black shadow-md; }
            .apple-label { @apply block text-[0.85rem] font-semibold text-apple-subtext mb-1.5 ml-1; }

            .panel { @apply glass-card p-6 mb-6; }
            .chart-card { @apply p-5 mb-0 flex flex-col justify-between; }
            .panel-header { @apply flex justify-between items-center mb-5; }
            .panel-title { @apply text-lg font-bold text-apple-text; }
            .latest-val { @apply font-bold text-apple-blue text-sm bg-apple-blue/15 px-3 py-1 rounded-full; }

            .status-badge { @apply bg-apple-blue/15 text-apple-blue text-[0.8rem] font-bold px-3 py-1.5 rounded-full backdrop-blur-md; }
            .timer-badge { @apply bg-apple-green/15 text-apple-green text-[0.8rem] font-bold px-3 py-1.5 rounded-full backdrop-blur-md; }
            .role-badge { @apply bg-apple-orange/15 text-apple-orange text-[0.8rem] font-bold px-3 py-1.5 rounded-full border border-apple-orange/20 backdrop-blur-md; }

            /* 無滑動表格設計 (Full Width No-Scroll Table) */
            .table-container { @apply w-full rounded-2xl border border-white/40 bg-white/30 backdrop-blur-xl shadow-inner overflow-hidden; }
            th { @apply bg-white/70 backdrop-blur-xl text-apple-subtext font-bold text-[0.8rem] uppercase tracking-wider py-3 px-3 border-b border-white/50; }
            td { @apply py-3 px-3 border-b border-white/30 text-[0.85rem] font-medium text-apple-text align-middle break-all; }
            tr:hover td { @apply bg-white/40; }

            .modal-overlay { @apply fixed inset-0 bg-black/40 backdrop-blur-lg z-[10000] flex justify-center items-center p-4; }
            .modal-content { @apply bg-white/80 backdrop-blur-2xl border border-white/60 shadow-2xl rounded-[2rem] p-8 w-full max-w-sm text-center transform transition-all; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.4); }

        #reader, #giftReader { border-radius: 1.5rem; overflow: hidden; border: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5); }
        textarea { resize: vertical; min-height: 80px; }
        
        .tag-note {
            font-size: 0.75rem;
            color: var(--primary);
            background: rgba(0, 113, 227, 0.15);
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
        }

        #toast {
            @apply fixed bottom-8 left-1/2 -translate-x-1/2 md:left-auto md:right-8 md:-translate-x-0 px-6 py-3 rounded-full bg-white/90 backdrop-blur-xl text-apple-text font-semibold text-sm shadow-2xl z-[10000] border border-white/50;
            display: none;
        }
    </style>
</head>
<body class="text-apple-text selection:bg-apple-blue/20">

<!-- 🌐 語言選擇彈窗 -->
<div id="firstLangModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h3 class="text-xl font-bold mb-6 leading-relaxed">🌐 請選擇語言<br><span class="text-[0.95rem] text-apple-subtext font-medium">Please Select Language</span></h3>
        <div class="flex flex-col gap-3">
            <button class="apple-btn btn-primary w-full py-3.5 text-[1rem]" onclick="selectInitialLanguage('zh-TW')">🇭🇰 繁體中文</button>
            <button class="apple-btn btn-secondary w-full py-3.5 text-[1rem]" onclick="selectInitialLanguage('en')">🇺🇸 English</button>
        </div>
    </div>
</div>

<!-- 🔒 登入介面 -->
<div id="loginScreen" class="fixed inset-0 flex items-center justify-center p-4 z-[9999]">
    <div class="glass-card p-10 w-full max-w-[400px] text-center relative shadow-2xl border border-white/50">
        <button class="absolute top-4 right-4 apple-btn btn-secondary !px-3 !py-1 !text-xs" onclick="toggleLanguage()">🌐 EN / 繁中</button>
        <div class="w-16 h-16 bg-gradient-to-tr from-apple-blue to-indigo-400 rounded-[1.25rem] mx-auto mb-4 flex items-center justify-center shadow-lg shadow-blue-500/40">
            <span class="text-white text-2xl">📈</span>
        </div>
        <h2 class="text-2xl font-bold tracking-tight mb-1">Pharm-E-co</h2>
        <p class="text-apple-subtext text-sm font-medium mb-8" data-i18n="loginSub">服務器數據管理台</p>

        <div id="reader" class="mb-5 hidden bg-white"></div>

        <div class="space-y-4 mb-6">
            <input type="text" id="loginUser" class="apple-input" data-i18n-ph="loginUserPH" placeholder="請輸入使用者名稱">
            <input type="password" id="loginPass" class="apple-input" data-i18n-ph="loginPassPH" placeholder="請輸入密碼">
        </div>
        
        <div class="flex gap-3 mt-2">
            <button class="apple-btn btn-primary flex-1 py-3.5" onclick="handleLogin()" data-i18n="btnLogin">登入</button>
            <button class="apple-btn btn-dark flex-1 py-3.5" onclick="startQRScanner()" data-i18n="btnScanLogin">📷 掃碼登入</button>
        </div>
        <p id="loginError" class="text-apple-red mt-4 hidden break-all text-sm font-semibold"></p>
    </div>
</div>

<!-- 🖥️ 主應用介面 -->
<div id="mainApp" class="hidden max-w-7xl mx-auto p-4 md:p-8 space-y-6">
    <!-- Header -->
    <header class="glass-card px-6 py-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <h1 class="text-[1.35rem] font-bold text-apple-text tracking-tight flex items-center gap-2" data-i18n="dashTitle">
            <span class="text-apple-blue">📈</span> Pharm-E-co數據管理台
        </h1>
        <div class="flex flex-wrap items-center gap-2.5">
            <button class="apple-btn btn-secondary !py-1.5 !px-3 !text-xs" onclick="toggleLanguage()">🌐 EN / 繁中</button>
            <span class="role-badge" id="displayRole">身分: 未知</span>
            <button class="apple-btn btn-warning !py-1.5 !text-xs" id="btnRedeemGift" onclick="startGiftRedeemScanner()" data-i18n="btnRedeemGift">🎁 兌換禮品</button>
            <button class="apple-btn btn-warning !py-1.5 !text-xs" id="btnCustomQR" onclick="generateCustomPointsQR()" data-i18n="btnCustomQR">🎫 自定義數量積分</button>
            <span class="timer-badge">⏳ <span id="timerSec">20</span> <span data-i18n="unitSec">秒</span></span>
            <span class="status-badge" id="apiStatus">連接中</span>
            <button class="apple-btn btn-primary !py-1.5 !px-4 !text-xs" onclick="manualRefresh()" data-i18n="btnRefresh">🔄 刷新</button>
            <button class="apple-btn btn-dark !py-1.5 !px-4 !text-xs" onclick="logout()" data-i18n="btnLogout">🚪 登出</button>
        </div>
    </header>

    <!-- API 設定區 -->
    <div class="glass-card p-6 grid grid-cols-1 md:grid-cols-3 gap-5 hidden" id="configCard">
        <div>
            <label class="apple-label" data-i18n="apiUrlLabel">API 接口地址</label>
            <input type="text" id="apiUrl" class="apple-input !py-2.5" value="https://tinywebdb.appinventor.space/api">
        </div>
        <div>
            <label class="apple-label" data-i18n="apiUserLabel">服務器用戶名 (user)</label>
            <input type="text" id="apiUser" class="apple-input !py-2.5" value="ryolin">
        </div>
        <div>
            <label class="apple-label" data-i18n="apiSecretLabel">服務器密鑰 (secret)</label>
            <input type="password" id="apiSecret" class="apple-input !py-2.5" value="0764433e">
        </div>
    </div>

    <!-- 👥 總使用人數顯示區域 -->
    <div class="glass-card p-6 md:px-10 flex justify-between items-center bg-white/70">
        <div>
            <h3 class="text-[1.1rem] font-bold text-apple-text tracking-tight mb-1" data-i18n="userCountTitle">👥 網頁版 App 使用人數</h3>
        </div>
        <div class="text-4xl md:text-5xl font-black tracking-tight text-apple-blue drop-shadow-sm" id="totalUserCount">0</div>
    </div>

    <!-- 📋 數據總覽 (滿頁寬度 100% 獨立展示) -->
    <div class="panel w-full">
        <div class="panel-header mb-4 flex-col sm:flex-row gap-3">
            <span class="panel-title" data-i18n="tableTitle">📋 數據總覽</span>
            <input type="text" id="searchInput" class="apple-input !py-1.5 !px-3 sm:!w-48 !text-sm" data-i18n-ph="searchPH" placeholder="搜尋..." oninput="filterTable()">
        </div>
        <div class="table-container">
            <table class="w-full text-left text-sm table-fixed">
                <thead>
                    <tr>
                        <th class="w-3/12 sm:w-3/12" data-i18n="thTag">Tag (標籤)</th>
                        <th class="w-2/12 sm:w-2/12" data-i18n="thNote">備註</th>
                        <th class="w-4/12 sm:w-4/12" data-i18n="thVal">Value (數值)</th>
                        <th class="w-3/12 sm:w-3/12 text-right pr-4" id="thActions" data-i18n="thActions">操作</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <tr><td colspan="4" class="text-center py-8 text-apple-subtext font-medium" data-i18n="loading">讀取中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 下方分欄：左側修改資料 / 右側圖表區 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- 左側編輯面板 -->
        <div class="lg:col-span-4" id="editPanel">
            <div class="panel h-full">
                <div class="panel-header">
                    <span class="panel-title" data-i18n="editPanelTitle">✏️ 寫入/修改數據</span>
                </div>
                <div class="flex flex-col gap-4">
                    <div>
                        <label class="apple-label" data-i18n="tagLabel">標籤名稱 (Tag)</label>
                        <input type="text" id="inputTag" class="apple-input" data-i18n-ph="tagPH" placeholder="如: temp, speed...">
                    </div>
                    <div>
                        <label class="apple-label" data-i18n="valueLabel">標籤值 (Value)</label>
                        <textarea id="inputValue" class="apple-input" data-i18n-ph="valPH" placeholder="輸入數字或文本"></textarea>
                    </div>
                    <button class="apple-btn btn-primary w-full py-3 mt-2" onclick="saveData()" data-i18n="btnSubmit">提交保存</button>
                </div>
            </div>
        </div>

        <!-- 右側折線圖區域 -->
        <div class="lg:col-span-8" id="chartPanel">
            <div class="panel h-full min-h-[400px]">
                <div class="panel-header">
                    <span class="panel-title" data-i18n="chartPanelTitle">📊 數值型數據歷史趨勢 (折線圖)</span>
                </div>
                <div id="chartsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="col-span-full text-center text-apple-subtext font-medium py-12" data-i18n="noNumericData">
                        尚無數據或未檢測到數值型 Tag
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>

<!-- 📄 顯示全文彈窗 -->
<div id="fullValueModal" class="modal-overlay" style="display:none;">
    <div class="modal-content !max-w-md !text-left">
        <h3 id="fullValueTagTitle" class="text-lg font-bold mb-3 text-apple-blue font-mono"></h3>
        <div class="apple-input !bg-white/80 !p-4 max-h-[300px] overflow-y-auto break-all font-mono text-xs mb-6 select-all whitespace-pre-wrap" id="fullValueContent"></div>
        <button class="apple-btn btn-primary w-full py-3" onclick="closeFullValueModal()" data-i18n="btnCloseModal">關閉視窗</button>
    </div>
</div>

<!-- 🎫 QR Code 生成彈窗 -->
<div id="qrModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h3 id="qrTitle" class="text-xl font-bold mb-6 text-apple-text">積分 QR Code</h3>
        <div id="qrcode-display" class="flex justify-center mb-8 p-4 bg-white rounded-2xl shadow-sm border border-gray-100 mx-auto w-fit"></div>
        <button class="apple-btn btn-secondary w-full py-3" onclick="closeQRModal()" data-i18n="btnCloseModal">關閉視窗</button>
    </div>
</div>

<!-- 📷 禮品兌換：相機掃碼彈窗 -->
<div id="giftScanModal" class="modal-overlay" style="display:none;">
    <div class="modal-content !max-w-md">
        <h3 class="text-xl font-bold text-apple-text" data-i18n="giftScanTitle">📷 掃描禮品兌換碼</h3>
        <div id="giftReader" class="w-full my-6 bg-black/5 rounded-[1.5rem]"></div>
        <button class="apple-btn btn-secondary w-full py-3" onclick="closeGiftScanModal()" data-i18n="btnCloseModal">關閉視窗</button>
    </div>
</div>

<!-- 🎁 禮品兌換：明細與核銷確認頁面彈窗 -->
<div id="giftDetailModal" class="modal-overlay" style="display:none;">
    <div class="modal-content !max-w-md !text-left">
        <h3 class="text-xl font-bold text-center mb-6 text-apple-text" data-i18n="giftConfirmTitle">🎁 禮品兌換核銷</h3>
        <div id="giftDetailBody" class="space-y-4"></div>
        <div id="giftDetailActions" class="flex gap-3 mt-8"></div>
    </div>
</div>

    function safeParseJSON(rawText) {
        if (!rawText) return null;
        if (typeof rawText === 'object') return rawText;
        let str = String(rawText).trim().replace(/^\uFEFF/, '');
        const firstBrace = str.indexOf('{');
        const lastBrace = str.lastIndexOf('}');
        const firstBracket = str.indexOf('[');
        const lastBracket = str.lastIndexOf(']');
        let start = -1, end = -1;
        if (firstBrace !== -1 && (firstBracket === -1 || firstBrace < firstBracket)) {
            start = firstBrace; end = lastBrace;
        } else if (firstBracket !== -1) {
            start = firstBracket; end = lastBracket;
        }
        if (start !== -1 && end !== -1 && end > start) {
            str = str.substring(start, end + 1);
        }
        try { return JSON.parse(str); } catch (e) {}
        try {
            let clean = str.replace(/,\s*([\}\]])/g, '$1').replace(/[\r\n\t]/g, ' ').replace(/\\'/g, "'");
            return JSON.parse(clean);
        } catch (e) {}
        return null;
    }

    function getSafeId(tag) { return 'tag_' + btoa(unescape(encodeURIComponent(tag))).replace(/=/g, '').replace(/[^a-zA-Z0-9]/g, '_'); }

    async function apiPost(action, extraParams = {}) {
        const url = document.getElementById('apiUrl').value.trim();
        const user = document.getElementById('apiUser').value.trim();
        const secret = document.getElementById('apiSecret').value.trim();
        const formData = new URLSearchParams();
        formData.append('user', user);
        formData.append('secret', secret);
        formData.append('action', action);
        for (const key in extraParams) formData.append(key, extraParams[key]);
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
            body: formData.toString()
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const rawText = await response.text();
        const parsed = safeParseJSON(rawText);
        return parsed !== null ? parsed : rawText;
    }

    async function refreshData(isAuto = false) {
        const dict = i18nData[currentLang];
        try {
            document.getElementById('apiStatus').innerText = dict.statusLoading;
            const res = await apiPost('search', { tag: '', type: 'both', no: 1, count: 100 });
            document.getElementById('apiStatus').innerText = dict.statusOnline;
            let parsedList = [];
            if (Array.isArray(res)) {
                if (res.length > 0 && Array.isArray(res[0])) parsedList = res.map(item => ({ tag: String(item[0]), value: String(item[1]) }));
                else if (res[0] === 'VALUE') parsedList = [{ tag: String(res[1]), value: String(res[2]) }];
                else parsedList = res.map((item, idx) => ({ tag: `Item_${idx}`, value: JSON.stringify(item) }));
            } else if (typeof res === 'object' && res !== null) {
                parsedList = Object.keys(res).map(k => ({ tag: k, value: typeof res[k] === 'object' ? JSON.stringify(res[k]) : String(res[k]) }));
            } else parsedList = [{ tag: 'Unknown', value: String(res) }];
            globalData = parsedList;
            renderTable(globalData);
            let totalUsers = 0;
            parsedList.forEach(item => { if (item.tag && String(item.tag).trim().toUpperCase().startsWith('VIS')) totalUsers++; });
            document.getElementById('totalUserCount').innerText = totalUsers.toLocaleString();
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0]; 
            const currentNumericTags = new Set();
            parsedList.forEach(item => {
                const valNum = parseFloat(item.value);
                if (!isNaN(valNum) && item.value.trim() !== '') {
                    currentNumericTags.add(item.tag);
                    if (!tagHistory[item.tag]) tagHistory[item.tag] = [];
                    if (tagHistory[item.tag].length >= 15) tagHistory[item.tag].shift();
                    tagHistory[item.tag].push({ time: timeStr, value: valNum });
                }
            });
            updateLineCharts(currentNumericTags);
            if (!isAuto) showToast(dict.toastDataRefreshed);
        } catch (e) {
            document.getElementById('apiStatus').innerText = dict.statusError;
            if(!isAuto) showToast(dict.toastConnFailed);
        }
    }

            let valCellHtml = '';

            }

    function updateLineCharts(numericTagsSet) {
        const container = document.getElementById('chartsGrid');
        const notes = getNotes();
        const dict = i18nData[currentLang];
        for (let tag in chartInstances) {
            if (!numericTagsSet.has(tag)) {
                chartInstances[tag].destroy();
                delete chartInstances[tag];
                const card = document.getElementById(`card_${getSafeId(tag)}`);
                if (card) card.remove();
            }
        }
        if (numericTagsSet.size === 0) {
            container.innerHTML = `<div class="col-span-full text-center text-apple-subtext font-medium py-12">${dict.noNumericData}</div>`;
            return;
        }
        if (container.children.length === 1 && (container.children[0].innerText.includes('尚無數據') || container.children[0].innerText.includes('No numeric'))) {
            container.innerHTML = '';
        }
        numericTagsSet.forEach(tag => {
            const safeId = getSafeId(tag);
            let card = document.getElementById(`card_${safeId}`);
            const noteDisplay = notes[tag] ? `<span class="tag-note">${escapeHtml(notes[tag])}</span>` : '';
            if (!card) {
                card = document.createElement('div');
                card.id = `card_${safeId}`;
                card.className = 'glass-card chart-card bg-white/40 border-white/40 shadow-sm';
                card.innerHTML = `
                    <div class="panel-header !mb-2">
                        <span class="panel-title text-[0.95rem]" id="title_${safeId}">📌 ${escapeHtml(tag)} ${noteDisplay}</span>
                        <span class="latest-val" id="val_${safeId}">--</span>
                    </div>
                    <div class="relative w-full h-[180px]"><canvas id="canvas_${safeId}"></canvas></div>
                `;
                container.appendChild(card);
            } else {
                const titleEl = document.getElementById(`title_${safeId}`);
                if (titleEl) titleEl.innerHTML = `📌 ${escapeHtml(tag)} ${noteDisplay}`;
            }
            const history = tagHistory[tag] || [];
            const latest = history.length > 0 ? history[history.length - 1].value : '--';
            document.getElementById(`val_${safeId}`).innerText = `${dict.valCurrent}: ${latest}`;
            const ctx = document.getElementById(`canvas_${safeId}`).getContext('2d');
            const labels = history.map(h => h.time);
            const dataValues = history.map(h => h.value);
            if (chartInstances[tag]) {
                chartInstances[tag].data.labels = labels;
                chartInstances[tag].data.datasets[0].data = dataValues;
                chartInstances[tag].update();
            } else {
                chartInstances[tag] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{ label: tag, data: dataValues, borderColor: '#0071e3', backgroundColor: 'rgba(0, 113, 227, 0.2)', borderWidth: 2, fill: true, tension: 0.4, pointRadius: 2, pointHoverRadius: 4 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 10, family: 'system-ui' }, color: '#505055' } }, y: { border: { display: false }, grid: { color: 'rgba(0,0,0,0.08)' }, ticks: { font: { size: 10, family: 'system-ui' }, color: '#505055' } } } }
                });
            }
        });
    }

    function parseGiftContent(contentStr) {
        let lp1Count = 0; let lp2Count = 0;
        if (!contentStr) return { total: 0, lp1: 0, lp2: 0, raw: '' };
        const parts = String(contentStr).split(',');
        parts.forEach(part => {
            const clean = part.trim().toUpperCase();
            if (clean.includes('LP1')) { const m = clean.match(/LP1\s*-\s*(\d+)/); if (m) lp1Count += parseInt(m[1], 10); }
            if (clean.includes('LP2')) { const m = clean.match(/LP2\s*-\s*(\d+)/); if (m) lp2Count += parseInt(m[1], 10); }
        });
        return { total: lp1Count + lp2Count, lp1: lp1Count, lp2: lp2Count, raw: contentStr };
    }

        const modal = document.getElementById('giftScanModal');

    function handleScannedGiftCode(scannedText) {
        const rawText = scannedText.trim();
        const dict = i18nData[currentLang];
        if (!rawText) return;
        const ordMatch = rawText.match(/ORD[A-Za-z0-9_-]*/i);
        const targetCode = ordMatch ? ordMatch[0].toLowerCase() : rawText.toLowerCase();
        let foundItem = globalData.find(d => {
            const tagStr = String(d.tag).trim().toLowerCase();
            const rawLower = rawText.toLowerCase();
            if (tagStr === rawLower || tagStr === targetCode) return true;
            if (tagStr.includes(targetCode)) return true;
            if (targetCode.includes(tagStr) && tagStr.length >= 3) return true;
            const cleanTag = tagStr.replace(/[^a-z0-9]/g, '');
            const cleanTarget = targetCode.replace(/[^a-z0-9]/g, '');
            if (cleanTag && cleanTarget && (cleanTag === cleanTarget || cleanTag.includes(cleanTarget) || cleanTarget.includes(cleanTag))) return true;
            return false;
        });
        if (!foundItem && targetCode) foundItem = globalData.find(d => String(d.value).toLowerCase().includes(targetCode));
        if (foundItem) showGiftDetail(foundItem.tag, foundItem.value);
        else showGiftError(`${dict.errOrdNotFound}<br><span class="text-apple-subtext text-[0.85rem] mt-2 block font-normal">[內容: ${escapeHtml(rawText)}]</span>`);
    }

    function showGiftDetail(tag, value) {
        currentRedeemTag = tag;
        const dict = i18nData[currentLang];
        const giftInfo = parseGiftContent(value);
        const body = document.getElementById('giftDetailBody');
        const actions = document.getElementById('giftDetailActions');
        if (giftInfo.total === 0 && !value.toUpperCase().includes('LP')) {
            body.innerHTML = `
                <div class="text-center text-apple-red font-bold py-3 text-lg">${dict.errInvalidGiftFormat}</div>
                <div class="text-[0.85rem] text-apple-subtext bg-white/40 p-4 rounded-2xl break-all">
                    Tag: <b class="text-apple-text">${escapeHtml(tag)}</b><br>Value: ${escapeHtml(value)}
                </div>
            `;
            actions.innerHTML = `<button class="apple-btn btn-secondary w-full py-3.5" onclick="closeGiftDetailModal()">${dict.btnCloseModal}</button>`;
        } else {
            body.innerHTML = `
                <div class="bg-apple-blue/15 p-4 rounded-2xl border border-apple-blue/30 mb-4">
                    <div class="text-[0.8rem] text-apple-blue font-bold mb-1">訂單標籤 (Tag):</div>
                    <div class="text-xl font-bold text-apple-text font-mono tracking-tight">${escapeHtml(tag)}</div>
                </div>
                <div class="flex justify-between items-center bg-white/70 p-4 rounded-2xl shadow-sm border border-white/50 mb-4">
                    <span class="font-bold text-apple-text text-[1rem]">🎁 禮品總數量</span>
                    <span class="text-2xl font-black text-apple-blue">${giftInfo.total} 個</span>
                </div>
                <div class="bg-white/70 p-4 rounded-2xl shadow-sm border border-white/50 text-[0.95rem]">
                    <div class="font-bold text-apple-subtext mb-3">禮品種類明細</div>
                    <ul class="flex flex-col gap-3">
                        <li class="flex justify-between pb-3 border-b border-white/80">
                            <span class="font-medium">🪧 ${dict.lp1Name} (LP1)</span>
                            <span class="font-bold text-apple-text">${giftInfo.lp1} 個</span>
                        </li>
                        <li class="flex justify-between">
                            <span class="font-medium">🔑 ${dict.lp2Name} (LP2)</span>
                            <span class="font-bold text-apple-text">${giftInfo.lp2} 個</span>
                        </li>
                    </ul>
                </div>
            `;
            actions.innerHTML = `
                <button class="apple-btn btn-secondary flex-1 py-3.5" onclick="closeGiftDetailModal()">${dict.btnCancel}</button>
                <button class="apple-btn btn-primary flex-1 py-3.5" onclick="confirmRedeemGift()">${dict.btnConfirmRedeem}</button>
            `;
        }
        document.getElementById('giftDetailModal').style.display = 'flex';
    }

    function showGiftError(msgHtml) {
        const dict = i18nData[currentLang];
        const body = document.getElementById('giftDetailBody');
        const actions = document.getElementById('giftDetailActions');
        body.innerHTML = `<div class="text-center py-6"><div class="text-apple-red font-bold text-[1.05rem] leading-relaxed">${msgHtml}</div></div>`;
        actions.innerHTML = `<button class="apple-btn btn-secondary w-full py-3.5" onclick="closeGiftDetailModal()">${dict.btnCloseModal}</button>`;
        document.getElementById('giftDetailModal').style.display = 'flex';
    }

    function closeGiftDetailModal() {
        document.getElementById('giftDetailModal').style.display = 'none';
        currentRedeemTag = null;
    }

    async function confirmRedeemGift() {
        if (!currentRedeemTag || currentUserRole !== 'admin') return;
        const dict = i18nData[currentLang];
        try {
            await apiPost('delete', { tag: currentRedeemTag });
            showToast(`${dict.toastRedeemSuccess}${currentRedeemTag}`);
            closeGiftDetailModal();
            manualRefresh();
        } catch (e) { showToast('核銷失敗，請重試'); }
    }

    function filterTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const notes = getNotes();
        renderTable(globalData.filter(d => {
            const note = (notes[d.tag] || '').toLowerCase();
            return d.tag.toLowerCase().includes(query) || d.value.toLowerCase().includes(query) || note.includes(query);
        }));
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function escapeHtml(str) { return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])); }
</script>
</body>
</html>
